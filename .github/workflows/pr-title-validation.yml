name: PR Title Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: $PR_TITLE"

          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?(!)?: .+'; then
            echo "❌ PR title does not follow Conventional Commits"
            echo "Required format: <type>(<scope>): <description>"
            echo "  feat: MINOR | fix, docs, style, refactor, perf, chore: PATCH"
            echo "  test, build, ci: no release | feat!: / BREAKING CHANGE: MAJOR"
            echo "  ✅ feat(coach): aggiungi avviso sul sottosterzo"
            echo "  ❌ Fixed setup fix on R3E"
            exit 1
          fi

          echo "✅ PR title is valid"
